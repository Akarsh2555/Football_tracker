<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>AI Tactical Dashboard Desktop</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "v-dark-red": "#2a1515",
                        "v-dark-red-alt": "#331f1f",
                        "v-dark-red-light": "#3b2424",
                        "v-gold": "#d4af37",
                        "v-sand": "#e6c280",
                        "off-white": "#f8ecec",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    }
                },
            },
        }
    </script>
    <style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-v-dark-red text-off-white font-display overflow-hidden;
                height: 100dvh;
            }
        }
        .pitch-grid {
            background-image: linear-gradient(rgba(212, 171, 55, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(212, 171, 55, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .gold-glow {
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Legacy Overrides for integration */
        .loading-overlay {
            position: absolute; inset: 0; background: rgba(42, 21, 21, 0.8);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid var(--border-subtle);
            border-top-color: #d4af37; border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Custom Slider styles matching the theme */
        input[type=range] {
            width: 100%; -webkit-appearance: none; background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%;
            background: #d4af37; cursor: pointer; margin-top: -6px; box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: rgba(255, 255, 255, 0.1); border-radius: 2px;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="flex flex-col">
    <!-- Header / Nav -->
    <header class="h-12 border-b border-v-gold/20 flex items-center bg-v-dark-red-alt shrink-0 z-50">
        <div class="px-4 border-r border-v-gold/20 flex items-center gap-2">
            <span class="material-symbols-outlined text-v-gold text-lg">psychology</span>
            <span class="text-[10px] font-bold tracking-widest text-v-gold">AI.TACTICAL</span>
            <a href="index.html"
                class="ml-4 text-[9px] hover:text-v-gold text-white/50 border border-white/20 px-2 py-0.5 rounded">←
                BACK</a>
        </div>
        <div
            class="flex-1 overflow-x-auto no-scrollbar flex items-center gap-8 px-6 text-[10px] uppercase font-bold tracking-tight">
            <div class="flex items-center gap-2 whitespace-nowrap">
                <span class="text-off-white/40">Active Frame:</span>
                <span class="text-v-gold" id="ticker-frame">--</span>
            </div>
            <div class="flex items-center gap-2 whitespace-nowrap">
                <span class="text-off-white/40">Latency:</span>
                <span class="text-v-gold" id="ticker-lat">--</span>
            </div>
            <div class="flex items-center gap-2 whitespace-nowrap">
                <span class="text-off-white/40">Contextual xG:</span>
                <span class="text-v-gold" id="ticker-xg">--</span>
            </div>
            <div class="flex items-center gap-2 whitespace-nowrap">
                <span class="text-off-white/40">Possession Risk:</span>
                <span class="text-v-gold" id="ticker-risk">--</span>
            </div>
            <div class="flex items-center gap-2 whitespace-nowrap">
                <span class="text-off-white/40">Field Momentum:</span>
                <span class="text-v-gold" id="ticker-mom">--</span>
            </div>
            <div class="flex items-center gap-2 whitespace-nowrap">
                <span class="text-off-white/40">Optimal Pass EV:</span>
                <span class="text-v-gold" id="ticker-ev">--</span>
            </div>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-20 bg-v-dark-red border-r border-v-gold/20 flex flex-col items-center py-6 gap-8">
            <div class="flex flex-col items-center gap-3">
                <div class="size-2 rounded-full bg-v-gold gold-glow"></div>
                <div class="size-2 rounded-full bg-v-gold/30"></div>
                <div class="size-2 rounded-full bg-v-gold/30"></div>
            </div>

            <div class="flex-1 w-full flex flex-col items-center py-4 relative px-2">
                <!-- Timeline Slider -->
                <div class="h-full flex flex-col items-center" style="transform: rotate(270deg);">
                    <input type="range" id="frame-slider" min="52" max="749" value="52" step="1" style="width: 300px;">
                </div>
            </div>

            <div class="flex flex-col gap-6">
                <span class="material-symbols-outlined text-v-gold/60 text-lg">sensors</span>
                <span class="material-symbols-outlined text-v-gold/60 text-lg">query_stats</span>
                <span class="material-symbols-outlined text-v-gold/60 text-lg">settings</span>
            </div>
        </aside>

        <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
            <!-- Central Pitch -->
            <section class="flex-1 p-4 flex flex-col gap-4 overflow-hidden">
                <div class="flex justify-between items-center">
                    <h2 class="text-xs font-bold text-v-sand uppercase tracking-[0.2em]">Active Tactical Canvas</h2>
                    <div class="flex gap-2">
                        <div class="px-2 py-0.5 rounded border border-v-gold/30 bg-v-gold/10 text-[9px] text-v-gold">
                            LIVE_FEED</div>
                    </div>
                </div>

                <div
                    class="flex-1 bg-v-dark-red-light w-full rounded-lg border border-v-gold/10 relative overflow-hidden pitch-grid">

                    <div id="loading-overlay" class="loading-overlay">
                        <div class="spinner"></div>
                        <div class="mt-4 text-[10px] uppercase font-bold text-v-sand tracking-widest">Fusing Sensors...
                        </div>
                    </div>

                    <!-- Dynamic Pitch Image -->
                    <img id="pitch-img" src="" alt="Tactical Pitch"
                        style="width:100%; height:100%; object-fit:contain; display:none;">

                    <!-- Decorative HUD Overlays on default view -->
                    <div
                        class="pointer-events-none absolute inset-8 border border-off-white/5 rounded-sm mix-blend-overlay">
                    </div>
                    <div
                        class="pointer-events-none absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 size-28 border border-off-white/5 rounded-full mix-blend-overlay">
                    </div>
                </div>
            </section>

            <!-- Right Intel Panel -->
            <aside
                class="w-full md:w-80 bg-v-dark-red-alt border-l border-v-gold/20 p-4 flex flex-col gap-4 overflow-y-auto no-scrollbar">
                <h3 class="text-[10px] font-bold text-v-sand uppercase tracking-widest border-b border-v-gold/10 pb-2">
                    Pass Intelligence</h3>

                <div id="pass-cards-container" class="flex flex-col gap-4">
                    <!-- Populated dynamically -->
                </div>

                <div class="mt-auto space-y-3 pt-4 border-t border-v-gold/10">
                    <div class="p-3 bg-v-gold/5 border border-v-gold/20 rounded">
                        <p class="text-[8px] text-v-gold uppercase tracking-[0.2em] font-bold mb-1">System Telemetry</p>
                        <div class="flex justify-between text-[10px] font-bold mb-1">
                            <span class="text-off-white/50">Attackers</span>
                            <span id="tele-att" class="text-v-sand">--</span>
                        </div>
                        <div class="flex justify-between text-[10px] font-bold mb-1">
                            <span class="text-off-white/50">Defenders</span>
                            <span id="tele-def" class="text-[#64b5f6]">--</span>
                        </div>
                        <div class="flex justify-between text-[10px] font-bold mb-3">
                            <span class="text-off-white/50">Pass Options</span>
                            <span id="tele-opt" class="text-v-gold">--</span>
                        </div>
                        <div class="flex gap-1 mt-2">
                            <div class="h-1 flex-1 bg-v-gold"></div>
                            <div class="h-1 flex-1 bg-v-gold"></div>
                            <div class="h-1 flex-1 bg-v-gold"></div>
                            <div class="h-1 flex-1 bg-v-gold/20"></div>
                        </div>
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <!-- Script that hooks up logic to these exact ids -->
    <script src="tactical_engine.js"></script>
</body>

</html>
