<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <!-- Live Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries,typography"></script>
    <link href="style.css?v=3" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700;900&family=Inter:wght@400;600;800&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: white;
            height: 100dvh;
            overflow: hidden;
        }

        .font-oswald {
            font-family: 'Oswald', sans-serif;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Brutalist Slider */
        input[type=range] {
            width: 100%;
            -webkit-appearance: none;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 12px;
            background: #ccff00;
            cursor: pointer;
            margin-top: -10px;
            border: 2px solid #050505;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #ff2a4d;
        }
    </style>
</head>

<body class="flex flex-col">
    <!-- Super Brutalist Header -->
    <header class="h-16 border-b-4 border-[#ccff00] flex items-center bg-[#050505] shrink-0 z-50">
        <div class="px-6 border-r-4 border-[#ccff00] h-full flex items-center gap-4 bg-[#ccff00] text-black">
            <span class="material-symbols-outlined text-3xl font-black hidden md:block">psychology</span>
            <span class="text-xl font-oswald font-black uppercase tracking-tighter">AI.TACTICAL</span>
            <a href="index.html"
                class="ml-4 font-bold text-sm bg-black text-[#ccff00] px-3 py-1 hover:bg-white hover:text-black transition-colors uppercase tracking-widest border border-black">←
                ABORT</a>
        </div>
        <div class="flex-1 overflow-x-auto no-scrollbar flex items-center gap-8 px-8">
            <h1 class="font-oswald font-black text-2xl uppercase tracking-widest text-[#8a8a8a] whitespace-nowrap">
                ORCHESTRATOR <span class="text-white">DASHBOARD</span></h1>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden p-6 gap-6 bg-[#111]">
        <!-- LEFT PANEL: Brutalist AI Orchestrator Terminal -->
        <section
            class="flex flex-col w-full md:w-1/3 bg-[#050505] border-2 border-[#8a8a8a] relative shadow-[8px_8px_0px_#ccff00]">
            <div class="h-14 border-b-2 border-[#8a8a8a] flex items-center px-4 shrink-0 justify-between">
                <span class="text-lg font-oswald font-bold text-[#ccff00] uppercase tracking-widest">A.I. ORCHESTRATOR
                    FEED</span>
                <div class="w-3 h-3 bg-[#ff2a4d] animate-pulse rounded-full"></div>
            </div>

            <div id="ai-chat-messages"
                class="flex-1 overflow-y-auto p-6 flex flex-col gap-6 font-mono text-sm no-scrollbar">
                <div
                    class="text-[#8a8a8a] text-xs text-center uppercase tracking-widest font-bold border-b border-[#8a8a8a]/30 pb-4">
                    System Online // Swarm Active</div>
            </div>

            <div class="p-4 border-t-2 border-[#8a8a8a] shrink-0 bg-[#050505]">
                <div
                    class="flex relative border-2 border-[#ccff00] group focus-within:shadow-[4px_4px_0px_#ccff00] transition-shadow bg-black">
                    <input type="text" id="ai-chat-input" placeholder="DEFINE TACTICAL QUERY..."
                        class="w-full bg-transparent p-4 font-mono text-[#ccff00] uppercase placeholder-[#8a8a8a] outline-none">
                    <button id="ai-send-btn"
                        class="bg-[#ccff00] text-black font-oswald font-black px-6 uppercase hover:bg-white transition-colors border-l-2 border-[#ccff00]">
                        TRANSMIT
                    </button>
                </div>
            </div>
        </section>

        <!-- RIGHT PANEL: Video Optics & Telemetry -->
        <section class="flex-1 flex flex-col gap-6 overflow-hidden">

            <!-- Brutalist Video Grid -->
            <div class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-6 min-h-[50%]">
                <div class="relative bg-black border-2 border-[#8a8a8a] flex items-center justify-center">
                    <div
                        class="absolute top-0 left-0 z-10 bg-[#ccff00] text-black px-3 py-1 text-sm font-oswald font-bold tracking-widest uppercase">
                        SPATIAL TRACKING
                    </div>
                    <video id="annotated-video" src="http://127.0.0.1:8000/output/output_tracked_video.mp4"
                        class="w-full h-full object-contain bg-black" controls muted loop autoplay></video>
                </div>

                <div
                    class="relative bg-black border-2 border-[#ff2a4d] flex items-center justify-center shadow-[4px_4px_0px_#ff2a4d]">
                    <div
                        class="absolute top-0 left-0 z-10 bg-[#ff2a4d] text-white px-3 py-1 text-sm font-oswald font-bold tracking-widest uppercase">
                        TACTICAL MAP 2D
                    </div>
                    <video id="tactical-map" src="http://127.0.0.1:8000/output/tactical_map_video.mp4"
                        class="w-full h-full object-contain bg-black" controls muted loop autoplay></video>
                </div>
            </div>

            <!-- Contextual Intel & Slider -->
            <div class="h-auto md:h-72 bg-[#050505] border-2 border-[#ccff00] p-6 flex flex-col shrink-0 relative">
                <div
                    class="absolute -top-3 right-4 bg-black text-[#ccff00] font-oswald font-bold px-2 tracking-widest uppercase border border-[#ccff00]">
                    LIVE TELEMETRY</div>

                <div class="flex justify-between items-center mb-6 border-b-2 border-[#444] pb-4">
                    <h3 class="text-xl font-oswald font-bold text-white uppercase tracking-tighter">DATA STREAM</h3>
                    <div class="flex gap-8 text-sm font-oswald font-bold tracking-widest uppercase">
                        <div class="text-[#8a8a8a]">LAT: <span id="ticker-lat" class="text-white ml-2">--</span></div>
                        <div class="text-[#8a8a8a]">xG: <span id="ticker-xg"
                                class="text-[#ccff00] ml-2 text-lg">--</span></div>
                        <div class="text-[#8a8a8a]">RISK: <span id="ticker-risk"
                                class="text-[#ff2a4d] ml-2 text-lg">--</span></div>
                    </div>
                </div>

                <div class="flex-1 flex flex-col justify-center">
                    <div id="loading-overlay" class="hidden justify-center items-center h-8 mb-4">
                        <span class="text-[#ccff00] font-oswald font-black uppercase text-xl animate-pulse">SYNCING
                            DATA...</span>
                    </div>

                    <div id="pass-cards-container"
                        class="flex gap-4 mb-6 overflow-x-auto no-scrollbar pb-4 items-center h-full">
                        <div class="text-[#8a8a8a] text-sm font-bold uppercase tracking-widest w-full text-center">
                            Awaiting Timeline Input...</div>
                    </div>
                </div>

                <div class="flex items-center mt-auto pt-6 border-t-2 border-[#444] bg-[#050505]">
                    <span
                        class="text-sm text-white font-oswald font-bold tracking-widest mr-6 bg-[#ff2a4d] px-3 py-1">FRAME</span>
                    <input type="range" id="frame-slider" min="0" max="1000" value="0" class="flex-1">
                    <div class="font-oswald font-black text-3xl ml-6 text-[#ccff00] w-24 text-right tabular-nums"><span
                            id="ticker-frame">0</span></div>
                </div>
            </div>

        </section>
    </div>

    <script src="tactical_engine.js?v=3"></script>
    <script src="tactical_chat.js?v=3"></script>
</body>

</html>
